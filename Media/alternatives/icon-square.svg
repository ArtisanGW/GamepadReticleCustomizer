<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gamepad Reticle Customizer: the game's white dot inside four corner brackets, as when editing it. -->
  <rect x="0" y="0" width="512" height="512" fill="#15202E"/>
  <g fill="#5BE0C8">
    <rect x="112" y="112" width="96" height="20"/><rect x="112" y="112" width="20" height="96"/>
    <rect x="304" y="112" width="96" height="20"/><rect x="380" y="112" width="20" height="96"/>
    <rect x="112" y="380" width="96" height="20"/><rect x="112" y="304" width="20" height="96"/>
    <rect x="304" y="380" width="96" height="20"/><rect x="380" y="304" width="20" height="96"/>
  </g>
  <!-- the reticle: the game's white dot -->
  <circle cx="256" cy="256" r="34" fill="#FFFFFF"/>
</svg>
